aemo_electricity:
  target: dev
  outputs:
    dev:
      type: duckrun
      # 2, not 4: this is the memory-heavy MERGE pipeline (fct_scada), and concurrent
      # writers now divide the delta-rs merge pool between them. Two keeps real parallelism
      # while leaving each merge half the budget rather than a quarter.
      threads: 2
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      # NB: no `settings: {preserve_insertion_order: false}` here — duckrun sets that by
      # default now (engine.configure_duckdb_memory), so large writes/merges don't OOM.
      # delta_rs writes land here as <root_path>/<schema>/<model> (arbitrary fs path).
      # Existing Delta tables are surfaced back as delta_scan views by the adapter, so
      # {{ this }} and is_incremental() resolve across separate dbt processes.
      root_path: "{{ env_var('WAREHOUSE_PATH') }}"
