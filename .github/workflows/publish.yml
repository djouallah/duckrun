name: publish

# A release is DISPATCHED on main (Actions → publish → Run workflow), after the `release: X.Y.Z`
# commit has bumped pyproject's version. Not a tag push: the Azure OIDC credential the Direct Lake
# gate signs in with trusts main only, so a tag-triggered run could never reach Fabric. The tag
# `vX.Y.Z` is pushed by this workflow, on the dispatched commit, after PyPI accepted the upload —
# so a release that fails a gate leaves no tag behind.
on:
  workflow_dispatch:

# Default token scope for jobs that don't override it below.
permissions:
  contents: read

# One release at a time.
concurrency:
  group: pypi
  cancel-in-progress: false

# A release must pass cores + local_stress_tests (TPC-H) + merge_spill + the Direct Lake gate +
# the Delta grid gate + the workload gate before publishing. Each is a reusable workflow run as a gate job here.
#   * cores includes the parquet layout contract (tests/adapter/test_layout_contract.py:
#     dictionary-first encoding_stats, full-dictionary pages, Delta stats, sort order kept by
#     rewrites, on every write path) and runs on the newest AND the floor duckdb / deltalake.
#   * direct-lake (writer_cold.yml with gate: true) builds the AEMO fact with both writers duckrun
#     ships — delta-rs (CTAS / append / compaction) and DuckDB copy-on-write (MERGE / UPDATE /
#     DELETE) — loads each into a fresh Direct Lake model and fails when a cold probe exceeds 2x
#     its baseline (tests/parquet_layout/writer_cold/gate_baseline.json). It costs Fabric capacity.
#   * workload-gate (workload_gate.yml) runs lakehouse_benchmark's real dbt workload, its duckrun
#     target (memory_limit 9GB), on runner disk: the models created from 30 daily files, then one
#     incremental run merging 365 more. 0.6.0-0.6.2 passed every other gate and failed there.
#   * delta-grid (delta_grid.yml) runs lakehouse_benchmark's whole Delta support grid, duckrun's
#     column, on THIS tree against OneLake, Spark-written tables (deletion vectors, column mapping,
#     type widening, change data feed) read AND written; a cell tests/delta_grid/baseline.json has
#     `supported` that is anything else fails the release.
# cores and merge_spill render scorecards into README/docs and commit them to main, so those call
# jobs grant contents:write (a reusable workflow can only use permissions the caller grants). The
# card jobs use static concurrency groups, so a release-time call queues behind any in-flight
# push-to-main run rather than racing it. merge_spill is its own workflow (not a
# local_stress_tests sibling job) so its runner — whose single-volume disk is the scarce resource —
# shares nothing with any other job.
# integration_tests_onelake is deliberately NOT a release gate: it depends on live OneLake/AEMO data
# and so is prone to transient infra failures that would needlessly block a publish. It still runs on
# its own.
jobs:
  # Fail in seconds, not after the gates: the release must come from main, and its version must
  # not have been released already (PyPI rejects a re-upload at the very last step).
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Dispatched on main, with an unreleased pyproject version
        id: v
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::dispatch publish on main (got $GITHUB_REF)"
            exit 1
          fi
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v is already tagged — bump pyproject.toml's version in a 'release: X.Y.Z' commit first."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "releasing v$v from $GITHUB_SHA"

  cores:
    needs: version-check
    permissions:
      contents: write
    uses: ./.github/workflows/cores.yml

  local-stress:
    needs: version-check
    permissions:
      contents: write
    uses: ./.github/workflows/local_stress_tests.yml

  merge-spill:
    needs: version-check
    permissions:
      contents: write
    uses: ./.github/workflows/merge_spill.yml

  direct-lake:
    needs: version-check
    permissions:
      contents: read
      id-token: write   # the Fabric sign-in (GitHub OIDC → Entra), trusted on main only
    uses: ./.github/workflows/writer_cold.yml
    secrets: inherit
    with:
      arms: "deltars,duckdb"
      duckdb_cli: cow
      gate: true

  delta-grid:
    needs: version-check
    permissions:
      contents: read
      id-token: write   # the OneLake sign-in (GitHub OIDC -> Entra), trusted on main only
    uses: ./.github/workflows/delta_grid.yml
    secrets: inherit

  workload-gate:
    needs: version-check
    permissions:
      contents: read
    uses: ./.github/workflows/workload_gate.yml

  publish:
    needs: [version-check, cores, local-stress, merge-spill, direct-lake, delta-grid, workload-gate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
      contents: write  # push the vX.Y.Z tag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag the release
        run: |
          git tag "v${{ needs.version-check.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ needs.version-check.outputs.version }}"
