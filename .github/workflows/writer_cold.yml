name: Writer cold benchmark (Direct Lake)

# MANUAL ONLY, non-gating. Answers the one question the layout A/B cannot: is the DuckDB writer's
# parquet actually good to READ COLD in Direct Lake?
#
# Cold-only by construction. There is no warm pass and no hot pass, and nothing is ever cleared:
# a FRESH semantic model is the cold guarantee, because a new dataset is the only reliable way to
# get an empty column store. Each query touches a column nothing has touched yet, so its duration
# is that column's Delta->memory transcode. probe_rowcount runs last as the ~zero-column control.
#
# Every Fabric item here is created by the run and deleted at the end.
#
#   wab_deltars.tests.fct_summary_deltars  <- build_auto_sort.py      (delta-rs writes)
#   wab_duckdb.tests.fct_summary_duckdb    <- build_duckdb_native.py  (DuckDB COPY writes)
#
# THIS COSTS REAL CAPACITY. It writes ~1.6 GB, deploys two Direct Lake models and queries them.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "deploy_config.yml env whose workspace hosts the temp items (and the source mart)"
        type: string
        default: main
      opt_sort:
        description: "the FIXED sort key both writers use. Explicit columns only, and every one of them must appear in `columns` — the sort is applied to the CTAS result. A full tie-break (date, time, DUID) makes the row order deterministic, so both writers receive an identical stream."
        type: string
        default: "date, time, DUID"
      row_limit:
        description: "row cap on the shared source mart.fct_summary (142M ≈ full)"
        type: string
        default: "142000000"
      opt_parquet_version:
        description: "[duckdb arm] PARQUET_VERSION. V1 tags dictionary data PLAIN_DICTIONARY, V2 tags the IDENTICAL bytes RLE_DICTIONARY (delta-rs always writes the latter). MEASURED: the tag changes nothing — the string column cold-read 12492ms on V1 and 12312ms on V2, against delta-rs's 2293ms. Kept as a control."
        type: choice
        default: V1
        options:
          - V1
          - V2
      opt_page_bytes:
        description: "[duckdb arm] DATA_PAGE_SIZE_LIMIT. arrow-rs caps a data page at 20,000 ROWS; DuckDB caps by bytes and by a 524,288-row ceiling, so at the 1048576 default its pages hold ~25x more rows than delta-rs's. 65536 lands DuckDB at ~32,768 rows/page — near parity, and free in bytes."
        type: string
        default: "1048576"
      opt_footer_inject:
        description: "[duckdb arm] comma-separated footer rewrites (footer_inject.FEATURES): logical (LogicalType), encstats (PageEncodingStats), offsetindex (OffsetIndex), encodings (complete the encodings list), createdby (masquerade as parquet-rs), nodistinct (drop distinct_count), nodeprecstats (drop the deprecated min/max pair DuckDB writes and parquet-cpp does not). The first six each measured flat ALONE; they all compose in ONE run — the conjunction no single-variable run can test. Empty writes DuckDB's footer untouched."
        type: string
        default: ""
      opt_reframe:
        description: "[duckdb arm] re-encode this column's dictionary indices at 63 groups per bit-packed run (504 values) — what parquet-rs and parquet-cpp both emit and DuckDB never does at any COPY setting. Same values, same bit width, same dictionary, same page boundaries; only the run boundaries move. 'DUID', or 'all', or empty to leave the pages alone."
        type: string
        default: ""
      opt_store_schema:
        description: "[pyarrow arm] pyarrow ParquetWriter store_schema. false strips the ARROW:schema footer key/value — the one footer property BOTH fast writers carry and DuckDB lacks. If the stripped pyarrow file cold-reads slow, the consumer's fast path is gated on ARROW:schema."
        type: boolean
        default: true
      opt_dict_sorted:
        description: "[duckdb arm] write the explicit is_sorted=False on dictionary page headers. Both fast writers emit it (17-byte header), DuckDB omits it (16 bytes), and no previous experiment could reach it — footer injection never touches page headers and the reframe copies dictionary headers through verbatim. The last page-internal property where the two fast writers agree and DuckDB differs. 'DUID', or 'all', or empty."
        type: string
        default: ""
      opt_transplant:
        description: "[pyarrow arm] replace this column's page bytes with the ones the DuckDB arm wrote, keeping pyarrow's container. Every metadata difference has been neutralised in one run with no effect, so the cost is in the payload — a slow read here proves it and a fast one refutes it. 'DUID', or empty. Requires arms=duckdb,pyarrow with opt_threads=1 and an opt_rg that is a multiple of 2048, so the row groups line up."
        type: string
        default: ""
      opt_rg:
        description: "ROW_GROUP_SIZE for every arm. DuckDB rounds this UP to a multiple of its 2048-row vector (6000000 becomes 6000640) while pyarrow slices exactly, so the arms only share row-group boundaries when this is already a multiple of 2048 — which a chunk-for-chunk comparison between two files requires."
        type: string
        default: "6000000"
      opt_threads:
        description: "[duckdb arm] COPY thread count. 2 is the memory-fit default; 1 makes row-group emission deterministic (stream order) — with 2 threads the parallel carve emits row groups OUT of stream order, a real difference from the single-stream fast writers (payload_diff shows rg0 holding mid-stream rows)."
        type: string
        default: "2"
      columns:
        description: "narrow both tables to these columns — a MINIMAL reproducer. 'date, time, DUID' writes ~1/5 the bytes of the full fact and measures exactly the same thing, because probing one column only transcodes that column. date and time are carried so the sort key stays intact and both writers receive an identically ordered stream; neither is ever probed. Empty = the full fact."
        type: string
        default: "date, time, DUID"
      probe_columns:
        description: "which columns the DAX suite probes (probe_rowcount always runs as the control). Must be a subset of `columns`."
        type: string
        default: "DUID"
      arms:
        description: "which writers to build and measure. delta-rs is a settled baseline (probe_duid 0.9-2.3s across nine runs) so re-measuring it costs capacity for a number we already have; 'duckdb' alone is also the cleanest order control, since nothing runs before it."
        type: choice
        default: duckdb
        options:
          - duckdb
          - deltars
          - pyarrow
          - deltars,duckdb
          - deltars,pyarrow
          - duckdb,pyarrow
          - deltars,duckdb,pyarrow
      order:
        description: "which writer is measured FIRST when arms builds both. The two passes share one capacity, so the second can inherit smoothing/throttling from the first — swap this and re-run to prove an effect is the parquet and not the running order."
        type: choice
        default: deltars_first
        options:
          - deltars_first
          - duckdb_first
      gap_seconds:
        description: "idle seconds between the two cold passes, so the first pass's capacity burst has smoothed out before the second is measured. 0 = back-to-back (not recommended)."
        type: string
        default: "300"
      keep:
        description: "skip teardown and leave the lakehouses + models standing (debugging). They bill storage until removed by hand."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  cold:
    name: 🧊 Cold Direct Lake — delta-rs vs DuckDB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      LH_DELTARS: wab_deltars
      LH_DUCKDB: wab_duckdb
      MODEL_DELTARS: writer_cold_deltars
      MODEL_DUCKDB: writer_cold_duckdb
      TABLE_DELTARS: fct_summary_deltars
      TABLE_DUCKDB: fct_summary_duckdb
      LH_PYARROW: wab_pyarrow
      MODEL_PYARROW: writer_cold_pyarrow
      TABLE_PYARROW: fct_summary_pyarrow
      ARMS: ${{ inputs.arms }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps (duckrun from THIS tree)
        run: |
          pip install pythonnet pyyaml pyarrow
          pip install fastparquet cramjam  # footer thrift + page decompression for the diffs
          pip install -e .

      - name: 🦆 Pin duckdb to the nightly that has DATA_PAGE_SIZE_LIMIT (duckdb#24645)
        run: pip install duckdb==1.6.0.dev365

      - name: 🧩 Install ADOMD.NET client (.NET Core build, cross-platform)
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/adomd"
          mkdir -p "$proj" && cd "$proj"
          dotnet new console -o . --force >/dev/null
          dotnet add package Microsoft.AnalysisServices.AdomdClient.NetCore.retail.amd64 >/dev/null
          dotnet publish -c Release -o publish >/dev/null
          test -f "$proj/publish/Microsoft.AnalysisServices.AdomdClient.dll"
          echo "ADOMD_DIR=$proj/publish" >> "$GITHUB_ENV"

      - name: 🔑 Resolve workspace + source lakehouse
        run: |
          echo "RUN_REPORT=$PWD/run_report.json" >> "$GITHUB_ENV"
          python tests/parquet_layout/aemo/resolve_env.py --env ${{ inputs.env }}

      - name: 📌 Pin the SOURCE tables path under its own name
        # resolve_env sets ONELAKE_TABLES_PATH to the PERMANENT lakehouse (where mart.fct_summary
        # lives). The build steps override that variable to point at their temp lakehouse, so the
        # source must be captured under a different name first — a step cannot safely reference a
        # variable it is itself overriding.
        run: echo "SRC_TABLES=$ONELAKE_TABLES_PATH" >> "$GITHUB_ENV"

      - name: 🏗️ Provision the throwaway lakehouses
        run: python tests/parquet_layout/writer_cold/provision.py create

      - name: 🧭 Build the delta-rs table
        if: ${{ contains(inputs.arms, 'deltars') }}
        env:
          PYTHONIOENCODING: utf-8
          # write into the temp lakehouse, read the permanent mart
          ONELAKE_TABLES_PATH: ${{ env.TABLES_DELTARS }}
          BENCH_SOURCE: delta_scan('${{ env.SRC_TABLES }}/mart/fct_summary')
          OPT_TABLE: ${{ env.TABLE_DELTARS }}
          OPT_COLUMNS: ${{ inputs.columns }}
          OPT_SORT: ${{ inputs.opt_sort }}
          FORCE_REBUILD: "true"
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/build_auto_sort.py

      - name: 🦆 Build the DuckDB-writer table
        if: ${{ contains(inputs.arms, 'duckdb') }}
        env:
          PYTHONIOENCODING: utf-8
          ONELAKE_TABLES_PATH: ${{ env.TABLES_DUCKDB }}
          BENCH_SOURCE: delta_scan('${{ env.SRC_TABLES }}/mart/fct_summary')
          OPT_TABLE: ${{ env.TABLE_DUCKDB }}
          OPT_COLUMNS: ${{ inputs.columns }}
          OPT_PARQUET_VERSION: ${{ inputs.opt_parquet_version }}
          OPT_PAGE_BYTES: ${{ inputs.opt_page_bytes }}
          OPT_FOOTER_INJECT: ${{ inputs.opt_footer_inject }}
          OPT_REFRAME: ${{ inputs.opt_reframe }}
          OPT_DICT_SORTED: ${{ inputs.opt_dict_sorted }}
          OPT_THREADS: ${{ inputs.opt_threads }}
          OPT_RG: ${{ inputs.opt_rg }}
          OPT_SORT: ${{ inputs.opt_sort }}
          FORCE_REBUILD: "true"
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/build_duckdb_native.py

      - name: 🏹 Build the pyarrow table (parquet-cpp writes, delta-rs commits)
        # A third, independent encoder. Same rows, same order, same geometry; everything after the
        # write - listing, typed footer stats, AddActions, commit - is the shared code path, so the
        # only thing that varies is which library encoded the parquet.
        if: ${{ contains(inputs.arms, 'pyarrow') }}
        env:
          PYTHONIOENCODING: utf-8
          ONELAKE_TABLES_PATH: ${{ env.TABLES_PYARROW }}
          BENCH_SOURCE: delta_scan('${{ env.SRC_TABLES }}/mart/fct_summary')
          OPT_TABLE: ${{ env.TABLE_PYARROW }}
          OPT_WRITER: pyarrow
          OPT_STORE_SCHEMA: ${{ inputs.opt_store_schema }}
          OPT_RG: ${{ inputs.opt_rg }}
          OPT_TRANSPLANT: ${{ inputs.opt_transplant }}
          OPT_TRANSPLANT_FROM: ${{ env.TABLES_DUCKDB }}/tests/${{ env.TABLE_DUCKDB }}
          OPT_COLUMNS: ${{ inputs.columns }}
          OPT_SORT: ${{ inputs.opt_sort }}
          FORCE_REBUILD: "true"
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/build_duckdb_native.py

      - name: 🚀 Deploy the two fresh Direct Lake models
        env:
          PYTHONIOENCODING: utf-8
          MODEL_COLUMNS: ${{ inputs.columns }}
        run: python tests/parquet_layout/writer_cold/deploy_models.py

      - name: 🧊 Cold passes — one per arm, in order
        # One loop instead of a hard-coded first/second: the arms list can hold three writers now.
        # Each pass is a fresh model's first touch of the column, which is the cold guarantee.
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          PROBE_COLUMNS: ${{ inputs.probe_columns }}
        run: |
          set -euo pipefail
          IFS=',' read -ra arms <<< "$ARMS"
          if [ "${{ inputs.order }}" = "duckdb_first" ]; then
            rev=(); for ((i=${#arms[@]}-1; i>=0; i--)); do rev+=("${arms[i]}"); done
            arms=("${rev[@]}")
          fi
          first=1
          for arm in "${arms[@]}"; do
            arm="$(echo "$arm" | tr -d '[:space:]')"
            case "$arm" in
              deltars) model="$MODEL_DELTARS" ;;
              duckdb)  model="$MODEL_DUCKDB"  ;;
              pyarrow) model="$MODEL_PYARROW" ;;
              *) echo "unknown arm '$arm'" >&2; exit 1 ;;
            esac
            if [ "$first" = 0 ] && [ "${{ inputs.gap_seconds }}" != "0" ]; then
              echo "idling ${{ inputs.gap_seconds }}s so the previous burst smooths out"
              sleep ${{ inputs.gap_seconds }}
            fi
            first=0
            MODEL="$model" VARIANT="$arm" python tests/parquet_layout/writer_cold/cold_bench.py
          done

      - name: 🔎 Storage DMV readout — what the transcode actually built
        # Consumer-side visibility: per-column resident encoding (HASH/VALUE), dictionary size,
        # and per-segment rows/bytes/compression/bits for each arm's model. Runs strictly AFTER
        # the cold loop, so its hydrate cannot disturb any cold number — re-touching columns is
        # exactly what the DMV read needs.
        if: ${{ always() }}
        continue-on-error: true
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          DMV_COLUMNS: ${{ inputs.columns }}
        run: |
          set -euo pipefail
          models=""
          case "$ARMS" in *deltars*) models="$MODEL_DELTARS" ;; esac
          case "$ARMS" in *duckdb*)  models="${models:+$models,}$MODEL_DUCKDB" ;; esac
          case "$ARMS" in *pyarrow*) models="${models:+$models,}$MODEL_PYARROW" ;; esac
          DMV_MODELS="$models" python tests/parquet_layout/aemo/vertipaq_dmv.py

      - name: 🧬 Payload diff — decode the files this run measured
        # Runs BEFORE teardown, against the exact tables the cold pass timed, rather than inferring
        # structure from a different pair built by another workflow.
        if: ${{ always() && contains(inputs.arms, 'duckdb') }}
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          PAYLOAD_DIFF_COLUMN: DUID
          ARMS: ${{ inputs.arms }}
        run: |
          set -euo pipefail
          uris=""
          case "$ARMS" in *deltars*) uris="$TABLES_DELTARS/tests/$TABLE_DELTARS" ;; esac
          case "$ARMS" in *duckdb*)  uris="${uris:+$uris,}$TABLES_DUCKDB/tests/$TABLE_DUCKDB" ;; esac
          case "$ARMS" in *pyarrow*) uris="${uris:+$uris,}$TABLES_PYARROW/tests/$TABLE_PYARROW" ;; esac
          PAYLOAD_DIFF_URIS="$uris" python tests/parquet_layout/aemo/payload_diff.py

      - name: 🔬 Page + footer diff — headers and the never-compared footer fields
        # walk_pages dumps DictionaryPageHeader encoding/is_sorted and PageHeader.crc; the footer
        # dump covers format version, root schema name, column_orders contents, key/value VALUES
        # (ARROW:schema), Statistics field shape, RowGroup/ColumnChunk offsets, and the dictionary
        # page's raw bytes — everything no tool had printed for the exact files being timed.
        if: ${{ always() && contains(inputs.arms, 'duckdb') }}
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          PAGE_DIFF_COLUMN: DUID
          PAGE_DIFF_ROW_GROUPS: "2"
        run: |
          set -euo pipefail
          uris=""
          case "$ARMS" in *deltars*) uris="$TABLES_DELTARS/tests/$TABLE_DELTARS" ;; esac
          case "$ARMS" in *duckdb*)  uris="${uris:+$uris,}$TABLES_DUCKDB/tests/$TABLE_DUCKDB" ;; esac
          case "$ARMS" in *pyarrow*) uris="${uris:+$uris,}$TABLES_PYARROW/tests/$TABLE_PYARROW" ;; esac
          PAGE_DIFF_URIS="$uris" python tests/parquet_layout/aemo/page_diff.py

      - name: 🧷 Full diff — every difference between the two files, one column
        # No rewrites and no measurement: it walks both files and prints every field that
        # differs, including the definition-level blocks, the bit-packed padding and whether
        # uncompressed_page_size matches the real decompressed length — none of which any
        # other tool here reads. The point is to stop assuming the list of differences is
        # complete and just enumerate it against the real files.
        if: ${{ always() && contains(inputs.arms, 'duckdb') }}
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          FULL_DIFF_COLUMN: DUID
          # Every row group, not the first two: the dictionary grows 217 -> 329 down the file and
          # the bit width flips 8 -> 9 around row group 5, so the majority of the chunk lives in a
          # regime the first two row groups never enter.
          FULL_DIFF_ROW_GROUPS: "24"
          FULL_DIFF_PAGES: "2"
        run: |
          set -euo pipefail
          uris=""
          case "$ARMS" in *duckdb*)  uris="$TABLES_DUCKDB/tests/$TABLE_DUCKDB" ;; esac
          case "$ARMS" in *pyarrow*) uris="${uris:+$uris,}$TABLES_PYARROW/tests/$TABLE_PYARROW" ;; esac
          case "$ARMS" in *deltars*) uris="${uris:+$uris,}$TABLES_DELTARS/tests/$TABLE_DELTARS" ;; esac
          FULL_DIFF_URIS="$uris" python tests/parquet_layout/aemo/full_diff.py

      - name: 📊 Summary
        if: ${{ always() }}
        continue-on-error: true
        run: python tests/parquet_layout/writer_cold/render_cold.py

      - name: 🧹 Teardown (always — a leaked lakehouse bills forever)
        if: ${{ always() && !inputs.keep }}
        run: python tests/parquet_layout/writer_cold/provision.py drop

      - name: 📎 Upload run report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: writer-cold-report
          path: run_report.json
          if-no-files-found: warn
