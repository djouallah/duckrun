name: Writer cold benchmark (Direct Lake)

# MANUAL ONLY, non-gating. Answers the one question the layout A/B cannot: is the DuckDB writer's
# parquet actually good to READ COLD in Direct Lake?
#
# Cold-only by construction. There is no warm pass and no hot pass, and nothing is ever cleared:
# a FRESH semantic model is the cold guarantee, because a new dataset is the only reliable way to
# get an empty column store. Each query touches a column nothing has touched yet, so its duration
# is that column's Delta->memory transcode. probe_rowcount runs last as the ~zero-column control.
#
# Every Fabric item here is created by the run and deleted at the end.
#
#   wab_deltars.tests.fct_summary_deltars  <- build_auto_sort.py      (delta-rs writes)
#   wab_duckdb.tests.fct_summary_duckdb    <- build_duckdb_native.py  (DuckDB COPY writes)
#
# THIS COSTS REAL CAPACITY. It writes ~1.6 GB, deploys two Direct Lake models and queries them.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "deploy_config.yml env whose workspace hosts the temp items (and the source mart)"
        type: string
        default: main
      opt_sort:
        description: "the FIXED sort key both writers use. Explicit columns only, and every one of them must appear in `columns` — the sort is applied to the CTAS result. A full tie-break (date, time, DUID) makes the row order deterministic, so both writers receive an identical stream."
        type: string
        default: "date, time, DUID"
      row_limit:
        description: "row cap on the shared source mart.fct_summary (142M ≈ full)"
        type: string
        default: "142000000"
      opt_parquet_version:
        description: "[duckdb arm] PARQUET_VERSION. V1 tags dictionary data PLAIN_DICTIONARY, V2 tags the IDENTICAL bytes RLE_DICTIONARY (delta-rs always writes the latter). MEASURED: the tag changes nothing — the string column cold-read 12492ms on V1 and 12312ms on V2, against delta-rs's 2293ms. Kept as a control."
        type: choice
        default: V1
        options:
          - V1
          - V2
      opt_page_bytes:
        description: "[duckdb arm] DATA_PAGE_SIZE_LIMIT. arrow-rs caps a data page at 20,000 ROWS; DuckDB caps by bytes and by a 524,288-row ceiling, so at the 1048576 default its pages hold ~25x more rows than delta-rs's. 65536 lands DuckDB at ~32,768 rows/page — near parity, and free in bytes."
        type: string
        default: "1048576"
      opt_footer_inject:
        description: "[duckdb arm] comma-separated footer metadata to add that DuckDB omits and delta-rs writes: encstats (PageEncodingStats), offsetindex (OffsetIndex), logical (LogicalType — already measured as a no-op). Empty writes DuckDB's footer untouched. A page-level diff proved the DATA is the same, so these are what is left."
        type: string
        default: ""
      columns:
        description: "narrow both tables to these columns — a MINIMAL reproducer. 'date, time, DUID' writes ~1/5 the bytes of the full fact and measures exactly the same thing, because probing one column only transcodes that column. date and time are carried so the sort key stays intact and both writers receive an identically ordered stream; neither is ever probed. Empty = the full fact."
        type: string
        default: "date, time, DUID"
      probe_columns:
        description: "which columns the DAX suite probes (probe_rowcount always runs as the control). Must be a subset of `columns`."
        type: string
        default: "DUID"
      arms:
        description: "which writers to build and measure. delta-rs is a settled baseline (probe_duid 0.9-2.3s across nine runs) so re-measuring it costs capacity for a number we already have; 'duckdb' alone is also the cleanest order control, since nothing runs before it."
        type: choice
        default: duckdb
        options:
          - duckdb
          - deltars
          - deltars,duckdb
      order:
        description: "which writer is measured FIRST when arms builds both. The two passes share one capacity, so the second can inherit smoothing/throttling from the first — swap this and re-run to prove an effect is the parquet and not the running order."
        type: choice
        default: deltars_first
        options:
          - deltars_first
          - duckdb_first
      gap_seconds:
        description: "idle seconds between the two cold passes, so the first pass's capacity burst has smoothed out before the second is measured. 0 = back-to-back (not recommended)."
        type: string
        default: "300"
      keep:
        description: "skip teardown and leave the lakehouses + models standing (debugging). They bill storage until removed by hand."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  cold:
    name: 🧊 Cold Direct Lake — delta-rs vs DuckDB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      LH_DELTARS: wab_deltars
      LH_DUCKDB: wab_duckdb
      MODEL_DELTARS: writer_cold_deltars
      MODEL_DUCKDB: writer_cold_duckdb
      TABLE_DELTARS: fct_summary_deltars
      TABLE_DUCKDB: fct_summary_duckdb
      ARMS: ${{ inputs.arms }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps (duckrun from THIS tree)
        run: |
          pip install pythonnet pyyaml
          pip install fastparquet cramjam  # footer thrift + page decompression for the diffs
          pip install -e .

      - name: 🦆 Pin duckdb to the nightly that has DATA_PAGE_SIZE_LIMIT (duckdb#24645)
        run: pip install duckdb==1.6.0.dev365

      - name: 🧩 Install ADOMD.NET client (.NET Core build, cross-platform)
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/adomd"
          mkdir -p "$proj" && cd "$proj"
          dotnet new console -o . --force >/dev/null
          dotnet add package Microsoft.AnalysisServices.AdomdClient.NetCore.retail.amd64 >/dev/null
          dotnet publish -c Release -o publish >/dev/null
          test -f "$proj/publish/Microsoft.AnalysisServices.AdomdClient.dll"
          echo "ADOMD_DIR=$proj/publish" >> "$GITHUB_ENV"

      - name: 🔑 Resolve workspace + source lakehouse
        run: |
          echo "RUN_REPORT=$PWD/run_report.json" >> "$GITHUB_ENV"
          python tests/parquet_layout/aemo/resolve_env.py --env ${{ inputs.env }}

      - name: 📌 Pin the SOURCE tables path under its own name
        # resolve_env sets ONELAKE_TABLES_PATH to the PERMANENT lakehouse (where mart.fct_summary
        # lives). The build steps override that variable to point at their temp lakehouse, so the
        # source must be captured under a different name first — a step cannot safely reference a
        # variable it is itself overriding.
        run: echo "SRC_TABLES=$ONELAKE_TABLES_PATH" >> "$GITHUB_ENV"

      - name: 🏗️ Provision the throwaway lakehouses
        run: python tests/parquet_layout/writer_cold/provision.py create

      - name: 🧭 Build the delta-rs table
        if: ${{ contains(inputs.arms, 'deltars') }}
        env:
          PYTHONIOENCODING: utf-8
          # write into the temp lakehouse, read the permanent mart
          ONELAKE_TABLES_PATH: ${{ env.TABLES_DELTARS }}
          BENCH_SOURCE: delta_scan('${{ env.SRC_TABLES }}/mart/fct_summary')
          OPT_TABLE: ${{ env.TABLE_DELTARS }}
          OPT_COLUMNS: ${{ inputs.columns }}
          OPT_SORT: ${{ inputs.opt_sort }}
          FORCE_REBUILD: "true"
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/build_auto_sort.py

      - name: 🦆 Build the DuckDB-writer table
        if: ${{ contains(inputs.arms, 'duckdb') }}
        env:
          PYTHONIOENCODING: utf-8
          ONELAKE_TABLES_PATH: ${{ env.TABLES_DUCKDB }}
          BENCH_SOURCE: delta_scan('${{ env.SRC_TABLES }}/mart/fct_summary')
          OPT_TABLE: ${{ env.TABLE_DUCKDB }}
          OPT_COLUMNS: ${{ inputs.columns }}
          OPT_PARQUET_VERSION: ${{ inputs.opt_parquet_version }}
          OPT_PAGE_BYTES: ${{ inputs.opt_page_bytes }}
          OPT_FOOTER_INJECT: ${{ inputs.opt_footer_inject }}
          OPT_SORT: ${{ inputs.opt_sort }}
          FORCE_REBUILD: "true"
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/build_duckdb_native.py

      - name: 🚀 Deploy the two fresh Direct Lake models
        env:
          PYTHONIOENCODING: utf-8
          MODEL_COLUMNS: ${{ inputs.columns }}
        run: python tests/parquet_layout/writer_cold/deploy_models.py

      - name: 🔀 Resolve measurement order
        # Both passes share one capacity, so whichever runs second can inherit the first's
        # smoothing. Order is an input precisely so a finding can be re-run the other way round:
        # an effect that survives the swap is the parquet, one that flips is the running order.
        run: |
          set -euo pipefail
          case "$ARMS" in
            duckdb)  first=duckdb;  second="" ;;
            deltars) first=deltars; second="" ;;
            *) if [ "${{ inputs.order }}" = "duckdb_first" ]; then first=duckdb; second=deltars
               else first=deltars; second=duckdb; fi ;;
          esac
          model() { if [ "$1" = duckdb ]; then echo "$MODEL_DUCKDB"; else echo "$MODEL_DELTARS"; fi; }
          echo "FIRST_VARIANT=$first"          >> "$GITHUB_ENV"
          echo "FIRST_MODEL=$(model "$first")" >> "$GITHUB_ENV"
          echo "SECOND_VARIANT=$second"        >> "$GITHUB_ENV"
          if [ -n "$second" ]; then echo "SECOND_MODEL=$(model "$second")" >> "$GITHUB_ENV"; fi

      - name: 🧊 Cold pass — first writer
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          MODEL: ${{ env.FIRST_MODEL }}
          VARIANT: ${{ env.FIRST_VARIANT }}
          PROBE_COLUMNS: ${{ inputs.probe_columns }}
        run: python tests/parquet_layout/writer_cold/cold_bench.py

      - name: 😴 Idle gap so the first pass's burst smooths out
        if: ${{ inputs.gap_seconds != '0' && env.SECOND_VARIANT != '' }}
        run: sleep ${{ inputs.gap_seconds }}

      - name: 🧊 Cold pass — second writer
        if: ${{ env.SECOND_VARIANT != '' }}
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          MODEL: ${{ env.SECOND_MODEL }}
          VARIANT: ${{ env.SECOND_VARIANT }}
          PROBE_COLUMNS: ${{ inputs.probe_columns }}
        run: python tests/parquet_layout/writer_cold/cold_bench.py

      - name: 🧬 Payload diff — decode the files this run measured
        # Runs BEFORE teardown, against the exact tables the cold pass timed, rather than inferring
        # structure from a different pair built by another workflow.
        if: ${{ always() && contains(inputs.arms, 'deltars') && contains(inputs.arms, 'duckdb') }}
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          PAYLOAD_DIFF_COLUMN: DUID
          PAYLOAD_DIFF_URIS: ${{ env.TABLES_DELTARS }}/tests/${{ env.TABLE_DELTARS }},${{ env.TABLES_DUCKDB }}/tests/${{ env.TABLE_DUCKDB }}
        run: python tests/parquet_layout/aemo/payload_diff.py

      - name: 📊 Summary
        if: ${{ always() }}
        continue-on-error: true
        run: python tests/parquet_layout/writer_cold/render_cold.py

      - name: 🧹 Teardown (always — a leaked lakehouse bills forever)
        if: ${{ always() && !inputs.keep }}
        run: python tests/parquet_layout/writer_cold/provision.py drop

      - name: 📎 Upload run report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: writer-cold-report
          path: run_report.json
          if-no-files-found: warn
