name: Writer byte verify (no Fabric)

# Ground truth for the writer investigation, and it costs NOTHING but a runner.
#
# Every question about "do these two files actually differ" was being answered either locally
# against DuckDB v1.5.5 (the only build with a Windows wheel) or as a step riding along on the
# 30-minute Fabric cold benchmark. Neither is right: CI writes with the pinned nightly, and the
# comparison needs no Fabric item at all. This reads the source lakehouse READ-ONLY, writes both
# writers' files to the runner's own disk, and compares the column chunk byte for byte.
#
# No lakehouse is created, no semantic model is deployed, no capacity is consumed.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "deploy_config.yml env whose workspace holds the SOURCE mart (read-only)"
        type: string
        default: main
      rows:
        description: "rows to read. Small is fine — this compares encodings, not scale."
        type: string
        default: "655360"
      skip:
        description: "rows to skip before taking `rows`. The fleet grows down the fact, so a large skip reaches the wider-dictionary regime where the bit width is 9 rather than 8."
        type: string
        default: "0"
      rg:
        description: "ROW_GROUP_SIZE. Must be a multiple of DuckDB's 2048-row vector AND <= 20000 (parquet-cpp's page cap) so both writers emit exactly one data page per row group and the pages correspond one-to-one."
        type: string
        default: "16384"
      column:
        description: "column to compare"
        type: string
        default: "DUID"
      columns:
        description: "columns to project"
        type: string
        default: "date, time, DUID"
      compression:
        description: "snappy reproduces what the benchmark writes. uncompressed is what makes byte IDENTITY reachable: the two writers' snappy encoders disagree by a byte or three on identical input, which drags the header size fields with it, and compression as a category is already dead by direct experiment (uncompressed on both arms, 11267.9 ms, flat)."
        type: choice
        default: snappy
        options:
          - snappy
          - uncompressed
      page_stats:
        description: "stamp the per-page Statistics parquet-cpp writes and DuckDB does not. The synthesizer is calibrated against the pyarrow arm's OWN file first and refuses to run unless it reproduces its headers byte for byte."
        type: boolean
        default: true
      require_identical:
        description: "fail the job unless the chunks are byte-identical. Turn this on to use the run as a hard precondition for a Fabric run rather than a log to read."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  bytes:
    name: 🔬 Byte verify — DuckDB vs parquet-cpp, same rows, same geometry
    runs-on: ubuntu-latest
    # 60, not 30: the preflight for a Fabric run reads millions of rows and decodes every page of
    # both writers' files, which the 30-minute budget was never sized for.
    timeout-minutes: 60
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps
        run: |
          pip install pyyaml pyarrow fastparquet cramjam
          pip install -e .

      - name: 🦆 Pin duckdb to the nightly the benchmark writes with
        # The whole point: compare the bytes THIS build emits, not the ones a different build
        # happens to emit on a laptop.
        run: pip install duckdb==1.6.0.dev365

      - name: 🧪 Page-statistics synthesizer guards (offline)
        # The synthesizer writes a DataPageHeader by hand, which is where this goes wrong quietly.
        # These run in a second and need no network, so they gate the comparison below rather than
        # letting a thrift bug surface as a "difference" between the writers.
        run: |
          pip install pytest
          python -m pytest tests/parquet_layout/aemo/test_page_stats.py -q -p no:cacheprovider

      - name: 🔑 Resolve the source workspace
        run: python tests/parquet_layout/aemo/resolve_env.py --env ${{ inputs.env }}

      - name: 🔬 Compare
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          BENCH_SOURCE: delta_scan('${{ env.ONELAKE_TABLES_PATH }}/mart/fct_summary')
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BYTES_ROWS: ${{ inputs.rows }}
          BYTES_SKIP: ${{ inputs.skip }}
          BYTES_RG: ${{ inputs.rg }}
          BYTES_COLUMN: ${{ inputs.column }}
          BYTES_COMPRESSION: ${{ inputs.compression }}
          BYTES_PAGE_STATS: ${{ inputs.page_stats }}
          BYTES_REQUIRE_IDENTICAL: ${{ inputs.require_identical }}
          OPT_COLUMNS: ${{ inputs.columns }}
        run: python tests/parquet_layout/aemo/byte_verify.py
