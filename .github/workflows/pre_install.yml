name: pre-install

# Manual check that the PUBLISHED duckrun still works as `pip install --pre "duckrun[dbt]"` resolves
# it today. A pre-release install pulls the newest duckdb 2.0 dev build, and DuckDB 2.0 is changing
# its Python result API (fetchone & co) — this catches a new duckdb build breaking a released duckrun.
# duckrun comes from PyPI, never from the checkout; the checkout only supplies the smoke script.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip install --pre duckrun[dbt] (from PyPI)
        run: pip install --pre "duckrun[dbt]"
      - name: Resolved versions
        run: pip show duckrun duckdb dbt-core dbt-duckdb | grep -E '^(Name|Version):'
      - name: Smoke — connect() DML + fetch*, incremental dbt run
        # Run from outside the checkout so `import duckrun` can only be the installed package.
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/pre_install/smoke.py"
