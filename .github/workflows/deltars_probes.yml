name: delta-rs probes

# Non-gating report: does the installed deltalake still have the upstream bugs duckrun works around?
# Bare deltalake, no duckrun code path (tests/upstream_probes/deltars_probes.py). Runs on the floor
# version and on the newest release; a workaround may go only when its probe reads FIXED on the
# floor. The table lands in each job's Step Summary.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/upstream_probes/**
      - .github/workflows/deltars_probes.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        deltalake: ["1.6.2", "latest"]
    name: probe (deltalake ${{ matrix.deltalake }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-duckrun
      - name: Pin deltalake
        run: |
          if [ "${{ matrix.deltalake }}" = "latest" ]; then pip install -U deltalake; else pip install "deltalake==${{ matrix.deltalake }}"; fi
          pip show deltalake | grep -E '^(Name|Version):'
      - name: Run probes
        run: python tests/upstream_probes/deltars_probes.py
