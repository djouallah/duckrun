name: Direct Lake query benchmark

# MANUAL ONLY, non-gating (never called by publish.yml). ONE workflow, two independent benchmark
# jobs selected by the `benchmark` input — the two projects stay separate (tests/parquet_layout/aemo
# and tests/parquet_layout/contoso), only the CI file is unified:
#   • aemo    — validates duckrun's parquet write layout against a real Fabric V-Order layout of the
#               AEMO fact, over the XMLA endpoint: _auto_sort (duckrun-clustered) vs _vorder (Spark
#               V-Order), both reading mart.fct_summary directly. See tests/parquet_layout/aemo/README.md.
#   • contoso — the Contoso sibling: same auto_sort-vs-vorder XMLA benchmark on the Contoso Sales fact,
#               generated from scratch with SQLBI's Contoso Data Generator into a DEDICATED, schema-
#               enabled `sqlbi` lakehouse. See tests/parquet_layout/contoso/README.md.
#   • order_probe — does V-Order PERMUTE rows or only re-encode them? Seeds a rid-stamped table of
#               known physical order, writes it via Spark with V-Order on AND off (the off write is
#               the control for Spark's own plumbing), then diffs the physical row order + per-column
#               run counts. No semantic model, no XMLA — Livy + OneLake only. See
#               tests/parquet_layout/aemo/vorder_order_probe.py.
#
# Both run on ubuntu-latest (ADOMD.NET's NetCore build is cross-platform, loads under pythonnet/coreclr).
# Pick one with the `benchmark` dropdown; the other job is skipped. Inputs are shared — `orders` is
# only read by contoso, `row_limit` by both (142M ≈ full for either fact).
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "which benchmark to run"
        type: choice
        default: aemo
        options:
          - aemo
          - contoso
          - order_probe
      env:
        description: "deploy_config.yml env whose workspace to query"
        type: string
        default: main
      orders:
        description: "[contoso] Contoso generator OrdersCount (scale knob; default matches the pre-built ~100M base so rebuild=false reuses it)"
        type: string
        default: "100000000"
      runs:
        description: "HOT runs per query per model (run 1/2 dropped as warm; rest averaged)"
        type: string
        default: "5"
      cold:
        description: "measure cold by dehydrating (clearValues+full) before each query"
        type: boolean
        default: true
      cold_repeats:
        description: "cold dehydrate→query cycles per cold-tier query (median + spread reported)"
        type: string
        default: "3"
      row_limit:
        description: "row cap for the shared base all layouts derive from (142M ≈ full for either fact; shrink to test small-table behaviour). Use with rebuild=true."
        type: string
        default: "142000000"
      gap_seconds:
        description: "idle seconds between the base and vorder benchmarks (>5min CU smoothing => clean gap in the capacity chart)"
        type: string
        default: "300"
      opt_sort:
        description: "duckrun sort for the auto_sort copy ('auto' recommender, or cols like 'date, time' / 'OrderDate, ProductKey')"
        type: string
        default: "auto"
      opt_rg:
        description: "[aemo] pin the auto_sort build's row-group ceiling (rows, e.g. 16000000; the harness spelling of the max_row_group_size model config). Empty = adaptive default. Use with rebuild=true."
        type: string
        default: ""
      opt_tfs_mb:
        description: "[aemo] pin the auto_sort build's target file size (MB, e.g. 1024 for a single ~765 MB file; the harness spelling of target_file_size_mb). Empty = 256 MB default. Use with rebuild=true."
        type: string
        default: ""
      opt_page_rows:
        description: "[aemo] pin the data-page ROW cap for the auto_sort build. Empty = the 1M default (raised from 20k in d0d23b4, so the 1 MB byte cap is what shapes pages). Use with rebuild=true."
        type: string
        default: ""
      writer:
        description: "[aemo] which writer builds the auto_sort table: delta_rs (CTAS, build_auto_sort.py) or duckdb_native (DuckDB COPY + delta-rs commit-only — exact 1-RG-per-file geometry, dictionary encoding control). Switch with rebuild=true or the existing table is reused."
        type: choice
        default: delta_rs
        options:
          - delta_rs
          - duckdb_native
      opt_dict_limit:
        description: "[aemo] duckdb_native only: DICTIONARY_SIZE_LIMIT — max distinct values per column that still dictionary-encodes. Empty = 16000000."
        type: string
        default: ""
      opt_page_bytes:
        description: "[aemo] duckdb_native only: DATA_PAGE_SIZE_LIMIT in bytes (duckdb#24645). Empty = 1048576 (~1 MB, the measured sweet spot of the page-size U-curve)."
        type: string
        default: ""
      dax:
        description: "run the Direct Lake half — deploy the two semantic models, walk the DAX suite, read the VertiPaq DMVs. OFF = layout only (sort key, table stats, parquet geometry): no semantic model is created, so it costs no interactive CU and finishes in minutes. Turn it off when the question is 'what did the picker choose / what shape did it write', on when the question is 'is it faster'."
        type: boolean
        default: true
      rebuild:
        description: "rebuild the auto_sort table (the table under test) even if it already exists (else reuse). The V-Order reference is NOT rebuilt by this on either benchmark — it never changes; see rebuild_vorder."
        type: boolean
        default: false
      rebuild_vorder:
        description: "also rebuild the Spark V-Order reference table (aemo or contoso; only needed when the source or row_limit changed — it depends on no duckrun knob)"
        type: boolean
        default: false
      rebuild_base:
        description: "[contoso] also regenerate the Contoso BASE from the SQLBI generator (~2h). The base is input data and depends on no duckrun knob, so a picker/layout change never needs it — same split as aemo's rebuild_vorder. Only set when `orders` changed."
        type: boolean
        default: false
      probe_rows:
        description: "[order_probe] rows in the seed table (20M ≈ 2 row groups per result; plenty to detect a permutation)"
        type: string
        default: "20000000"
      probe_seed_order:
        description: "[order_probe] physical order of the seed: sorted (date,time,DUID) or shuffle (hash of the key — max incentive for V-Order to reorder)"
        type: choice
        default: sorted
        options:
          - sorted
          - shuffle

permissions:
  id-token: write
  contents: read

jobs:
  aemo:
    name: 🔍 Benchmark (AEMO)
    if: ${{ inputs.benchmark == 'aemo' }}
    # Linux (was windows-latest): faster/cheaper runners, no Windows quirks. ADOMD.NET has a
    # cross-platform .NET Core build that loads under pythonnet/coreclr on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The only Azure inputs: the OIDC federated identity. duckrun mints every token it needs (storage,
      # Fabric, Power BI), picks the curl transport itself, AND resolves the workspace/lakehouse — so
      # there's no azure/login and no az rest anywhere in this job.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps (duckrun from THIS tree — tests the current WriterProperties)
        run: |
          pip install pythonnet pyyaml
          pip install -e .

      - name: 🦆 Pin duckdb to the nightly that has DATA_PAGE_SIZE_LIMIT (duckdb#24645)
        # Stable duckdb (<= 1.5.5) still hard-splits data pages at 100MB uncompressed — the exact
        # failure that killed this arm's first run (duckdb#24507). Its own step so the delta_rs
        # path stays byte-identical to main; build_duckdb_native.py probes the option at startup
        # and dies loudly if this pin ever stops carrying it.
        if: ${{ inputs.writer == 'duckdb_native' }}
        run: pip install duckdb==1.6.0.dev365

      - name: 🧾 Init run report
        env:
          BENCH_ENV: ${{ inputs.env }}
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_COLD: ${{ inputs.cold }}
          COLD_REPEATS: ${{ inputs.cold_repeats }}
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
          BENCH_GAP_SECONDS: ${{ inputs.gap_seconds }}
          OPT_SORT: ${{ inputs.opt_sort }}
          BENCH_WRITER: ${{ inputs.writer }}
          FORCE_REBUILD: ${{ inputs.rebuild }}
        run: |
          echo "RUN_REPORT=$PWD/run_report.json" >> "$GITHUB_ENV"
          RUN_REPORT="$PWD/run_report.json" python tests/parquet_layout/aemo/report.py init

      - name: 🧩 Install ADOMD.NET client (.NET Core build, cross-platform)
        run: |
          set -euo pipefail
          # ADOMD.NET's NetCore build is cross-platform and loads under pythonnet/coreclr. `dotnet
          # publish` a throwaway console app that references it so the DLL AND all its dependency
          # assemblies (Microsoft.Identity.Client, IdentityModel.*, …) land in one folder that
          # xmla_compare._load_adomd can glob. (A bare nupkg would miss the transitive deps.)
          proj="$RUNNER_TEMP/adomd"
          mkdir -p "$proj" && cd "$proj"
          dotnet new console -o . --force >/dev/null
          dotnet add package Microsoft.AnalysisServices.AdomdClient.NetCore.retail.amd64 >/dev/null
          dotnet publish -c Release -o publish >/dev/null
          test -f "$proj/publish/Microsoft.AnalysisServices.AdomdClient.dll"
          echo "ADOMD_DIR=$proj/publish" >> "$GITHUB_ENV"
          echo "resolved ADOMD_DIR=$proj/publish"

      - name: 🔑 Resolve lakehouse + workspace (duckrun, no az)
        # ws id from deploy_config; lakehouse id + workspace display name via duckrun's Fabric handle
        # (self-acquired OIDC token). Emits WS_ID / LH_ID / WS_NAME / ONELAKE_TABLES_PATH / PBI_WORKSPACE.
        run: python tests/parquet_layout/aemo/resolve_env.py --env ${{ inputs.env }}

      - name: 🔎 Check existing tables (one duckrun connection gates the whole build phase)
        id: check
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/parquet_layout/aemo/check_tables.py

      - name: 🔑 Show the resolved sort key
        # The one decision this whole comparison exists to interrogate, as its own step: one
        # profiling pass over the source, no build and no DAX, so it is readable on every dispatch
        # (including dax=false) instead of only as a side effect of a full rebuild. Never blocks —
        # this reports, it does not gate.
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          OPT_SORT: ${{ inputs.opt_sort }}
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/sort_key.py

      - name: ⚡ Build Spark V-Order table (Livy, reads mart.fct_summary directly)
        # skip-if-exists inside the script; only rebuild_vorder forces it (the reference never
        # changes with duckrun knobs, so the geometry experiments' rebuild leaves it alone)
        if: ${{ inputs.rebuild_vorder || steps.check.outputs.build_needed == 'true' }}
        env:
          PYTHONIOENCODING: utf-8
          FORCE_REBUILD_VORDER: ${{ inputs.rebuild_vorder }}
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/build_spark_variant.py

      - name: 🧭 Build auto_sort summary table (duckrun sorted, reads mart.fct_summary directly)
        if: ${{ inputs.writer != 'duckdb_native' && (inputs.rebuild || steps.check.outputs.build_needed == 'true') }}
        env:
          PYTHONIOENCODING: utf-8
          OPT_SORT: ${{ inputs.opt_sort }}
          OPT_RG: ${{ inputs.opt_rg }}
          OPT_TFS_MB: ${{ inputs.opt_tfs_mb }}
          OPT_PAGE_ROWS: ${{ inputs.opt_page_rows }}
          FORCE_REBUILD: ${{ inputs.rebuild }}
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/build_auto_sort.py

      - name: 🦆 Build auto_sort summary table (DuckDB COPY writes, delta-rs commits)
        # Same table slot (tests.fct_summary_auto_sort) so deploy/stats/XMLA/DMV run unchanged.
        # 'auto' is the delta-rs builder's sort spelling; the native builder needs explicit
        # columns, so the input's default remaps to the measured best key.
        if: ${{ inputs.writer == 'duckdb_native' && (inputs.rebuild || steps.check.outputs.build_needed == 'true') }}
        env:
          PYTHONIOENCODING: utf-8
          OPT_SORT: ${{ inputs.opt_sort == 'auto' && 'date, time' || inputs.opt_sort }}
          OPT_RG: ${{ inputs.opt_rg }}
          OPT_DICT_LIMIT: ${{ inputs.opt_dict_limit }}
          OPT_PAGE_BYTES: ${{ inputs.opt_page_bytes }}
          OPT_TFS_MB: ${{ inputs.opt_tfs_mb }}
          FORCE_REBUILD: ${{ inputs.rebuild }}
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/aemo/build_duckdb_native.py

      - name: 🚀 Deploy benchmark semantic models (auto_sort + vorder)
        if: ${{ inputs.dax }}
        # duckrun's own workspace.deploy() repoints, creates and refreshes each model with its
        # self-acquired OIDC tokens — no Fabric CLI login.
        run: python tests/parquet_layout/aemo/deploy_vorder.py --env ${{ inputs.env }}

      - name: 📊 Table stats (duckrun) — fct_summary_auto_sort vs fct_summary_vorder
        continue-on-error: true   # nice-to-have; never block the benchmark
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/parquet_layout/aemo/table_stats.py

      # No token re-mint before XMLA: xmla_compare.py self-acquires the Power BI token via duckrun,
      # which re-exchanges a fresh OIDC assertion (so a long rebuild can't hand back an expiring token).
      - name: 🔍 Benchmark both models over XMLA
        if: ${{ inputs.dax }}
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"   # non-TTY runner block-buffers stdout; stream the per-query trace live
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_COLD: ${{ inputs.cold }}
          COLD_REPEATS: ${{ inputs.cold_repeats }}
          BENCH_GAP_SECONDS: ${{ inputs.gap_seconds }}
        run: python tests/parquet_layout/aemo/xmla_compare.py

      - name: 🧬 VertiPaq DMV readout (resident encodings per column/segment, both models)
        if: ${{ inputs.dax }}
        continue-on-error: true   # diagnostic sidecar; never blocks the benchmark
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python tests/parquet_layout/aemo/vertipaq_dmv.py

      - name: 🧹 Delete benchmark semantic models (throwaway items — never accumulate)
        if: always()
        continue-on-error: true   # cleanup; never blocks the run or masks its result
        run: python tests/parquet_layout/aemo/deploy_vorder.py --env ${{ inputs.env }} --delete

      - name: 📝 Render report to job summary (computes + merges the analysis block)
        if: always()
        continue-on-error: true
        run: python tests/parquet_layout/aemo/render_report.py

      - name: 📑 Render specialist findings to job summary (verdict-direction mismatch = annotation)
        if: always()
        # A verdict-direction mismatch is a property of the DATA, not a broken run: it fires when the
        # aggregate and the per-query majority disagree, which is what a genuinely mixed result looks
        # like. The numbers are the deliverable, so the mismatch stays an annotation and the run still
        # reports. (The verdict layer's own logic is still gated by tests/parquet_layout/test_verdicts.py.)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/parquet_layout/aemo/render_summary.py

      - name: 📎 Upload run report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: run_report.json
          if-no-files-found: warn

  contoso:
    name: 🔍 Benchmark (Contoso)
    if: ${{ inputs.benchmark == 'contoso' }}
    # Linux (not windows-latest): faster/cheaper runners, no Windows quirks. ADOMD.NET has a
    # cross-platform .NET Core build that loads under pythonnet/coreclr on Linux.
    runs-on: ubuntu-latest
    # Default is the ~100M base (reused when rebuild=false; a fresh rebuild is ~2h, linear from ~86s
    # at 1M) plus the delta landing, the duckrun auto_sort re-sort, and the XMLA passes — all under
    # the 6h hosted-job cap. A smaller scale (e.g. orders=10000000) needs rebuild=true to regenerate.
    timeout-minutes: 350
    env:
      # The only Azure inputs: the OIDC federated identity. duckrun mints every token it needs, picks
      # the curl transport itself, creates the lakehouse AND resolves the workspace/lakehouse — so
      # there's no azure/login and no az rest anywhere in this job.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps (duckrun from THIS tree — tests the current WriterProperties)
        run: |
          pip install pythonnet pyyaml
          pip install -e .  # brings obstore (core dep) for the XMLA compare's OneLake reads

      - name: 🧾 Init run report
        env:
          BENCH_ENV: ${{ inputs.env }}
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_COLD: ${{ inputs.cold }}
          COLD_REPEATS: ${{ inputs.cold_repeats }}
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
          BENCH_GAP_SECONDS: ${{ inputs.gap_seconds }}
          OPT_SORT: ${{ inputs.opt_sort }}
          FORCE_REBUILD: ${{ inputs.rebuild }}
        run: |
          echo "RUN_REPORT=$PWD/run_report.json" >> "$GITHUB_ENV"
          RUN_REPORT="$PWD/run_report.json" python tests/parquet_layout/contoso/report.py init

      - name: 🧩 Install ADOMD.NET client (.NET Core build, cross-platform)
        run: |
          set -euo pipefail
          # ADOMD.NET's NetCore build is cross-platform and loads under pythonnet/coreclr. `dotnet
          # publish` a throwaway console app that references it so the DLL AND all its dependency
          # assemblies (Microsoft.Identity.Client, IdentityModel.*, …) land in one folder that
          # xmla_compare._load_adomd can glob. (A bare nupkg would miss the transitive deps.)
          proj="$RUNNER_TEMP/adomd"
          mkdir -p "$proj" && cd "$proj"
          dotnet new console -o . --force >/dev/null
          dotnet add package Microsoft.AnalysisServices.AdomdClient.NetCore.retail.amd64 >/dev/null
          dotnet publish -c Release -o publish >/dev/null
          test -f "$proj/publish/Microsoft.AnalysisServices.AdomdClient.dll"
          echo "ADOMD_DIR=$proj/publish" >> "$GITHUB_ENV"
          echo "resolved ADOMD_DIR=$proj/publish"

      - name: 🏗️ Create the sqlbi lakehouse (idempotent)
        env:
          PYTHONIOENCODING: utf-8
        # duckrun's own workspace API creates the schema-enabled lakehouse idempotently and
        # self-acquires the Fabric control-plane token from the OIDC identity — no az token step.
        # enableSchemas (schemas=True default): Contoso + tests tables live under schemas, which
        # Livy Spark + Direct Lake need to resolve.
        run: |
          python - <<'PY'
          import yaml, duckrun
          c = yaml.safe_load(open("tests/parquet_layout/contoso/deploy_config.yml"))
          e = {**c.get("defaults", {}), **c["${{ inputs.env }}"]}
          lh = duckrun.workspace(e["ws"]).create_lakehouse(e["lakehouse_name"], schemas=True)
          print(f"lakehouse '{e['lakehouse_name']}' ready ({lh})")
          PY

      - name: 🔑 Resolve lakehouse + workspace (duckrun, no az)
        # ws id from deploy_config; lakehouse id + workspace display name via duckrun's Fabric handle
        # (self-acquired OIDC token). Emits WS_ID / LH_ID / WS_NAME / ONELAKE_TABLES_PATH / PBI_WORKSPACE.
        run: python tests/parquet_layout/contoso/resolve_env.py --env ${{ inputs.env }}

      # The base is INPUT DATA — no duckrun knob affects it, and regenerating it is ~2h. So it is
      # gated on its own flag, not on `rebuild`: exactly the split aemo already has between
      # `rebuild` (the table under test) and `rebuild_vorder` (the reference). Without this, testing
      # a picker change meant paying two hours to rebuild data the change cannot touch.
      - name: 🏭 Generate Contoso base (SQLBI generator → contoso.* Delta tables)
        env:
          PYTHONIOENCODING: utf-8
          CONTOSO_ORDERS: ${{ inputs.orders }}
          FORCE_REBUILD: ${{ inputs.rebuild_base }}
        run: python tests/parquet_layout/contoso/build_base.py

      - name: 🔎 Check existing tables (one duckrun connection gates the build phase)
        id: check
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/parquet_layout/contoso/check_tables.py

      - name: ⚡ Build Spark V-Order table (Livy, reads contoso.sales directly)
        # Same split as aemo: the V-Order reference depends on no duckrun knob, so `rebuild` (the
        # table under test) must never force it — only rebuild_vorder does, or a missing table.
        if: ${{ inputs.rebuild_vorder || steps.check.outputs.build_needed == 'true' }}
        env:
          PYTHONIOENCODING: utf-8
          FORCE_REBUILD: ${{ inputs.rebuild_vorder }}
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/contoso/build_spark_variant.py

      - name: 🧭 Build auto_sort table (duckrun sorted, reads contoso.sales directly)
        if: ${{ inputs.rebuild || steps.check.outputs.build_needed == 'true' }}
        env:
          PYTHONIOENCODING: utf-8
          OPT_SORT: ${{ inputs.opt_sort }}
          FORCE_REBUILD: ${{ inputs.rebuild }}
          BENCH_ROW_LIMIT: ${{ inputs.row_limit }}
        run: python tests/parquet_layout/contoso/build_auto_sort.py

      - name: 🚀 Deploy benchmark semantic models (auto_sort + vorder)
        if: ${{ inputs.dax }}
        # duckrun's own workspace.deploy() repoints, creates and refreshes each model with its
        # self-acquired OIDC tokens — no Fabric CLI login.
        run: python tests/parquet_layout/contoso/deploy.py --env ${{ inputs.env }}

      - name: 📊 Table stats (duckrun) — sales_auto_sort vs sales_vorder
        continue-on-error: true   # nice-to-have; never block the benchmark
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/parquet_layout/contoso/table_stats.py

      # No token re-mint before XMLA: xmla_compare.py self-acquires the Power BI token via duckrun,
      # which re-exchanges a fresh OIDC assertion (so a long rebuild can't hand back an expiring token).
      - name: 🔍 Benchmark both models over XMLA
        if: ${{ inputs.dax }}
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"   # non-TTY runner block-buffers stdout; stream the per-query trace live
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_COLD: ${{ inputs.cold }}
          COLD_REPEATS: ${{ inputs.cold_repeats }}
          BENCH_GAP_SECONDS: ${{ inputs.gap_seconds }}
        run: python tests/parquet_layout/contoso/xmla_compare.py

      - name: 📝 Render report to job summary (computes + merges the analysis block)
        if: always()
        continue-on-error: true
        run: python tests/parquet_layout/contoso/render_report.py

      - name: 📑 Render specialist findings to job summary (verdict-direction mismatch = annotation)
        if: always()
        continue-on-error: true   # same rule as the aemo job above — see the comment there
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/parquet_layout/contoso/render_summary.py

      - name: 📎 Upload run report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-report-contoso
          path: run_report.json
          if-no-files-found: warn

  order-probe:
    name: 🧪 V-Order order probe
    if: ${{ inputs.benchmark == 'order_probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same OIDC-only auth as the benchmarks: duckrun mints storage + Fabric (Livy) tokens itself.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps (duckrun from THIS tree)
        run: |
          pip install pyyaml
          pip install -e .

      - name: 🔑 Resolve lakehouse + workspace (duckrun, no az)
        run: python tests/parquet_layout/aemo/resolve_env.py --env ${{ inputs.env }}

      - name: 🧪 Seed known order, write V-Order on/off via Livy, diff the physical order
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          FORCE_REBUILD: ${{ inputs.rebuild }}
          PROBE_ROWS: ${{ inputs.probe_rows }}
          PROBE_SEED_ORDER: ${{ inputs.probe_seed_order }}
        run: python tests/parquet_layout/aemo/vorder_order_probe.py
